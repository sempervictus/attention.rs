[package]
name = "kernels"
version = "0.5.1"
edition = "2021"
description = "Attention, MoE and GEMM kernels for Rust"
categories = ["science"]
license = "MIT OR Apache-2.0"

[dependencies]

[build-dependencies]
cudaforge = { git = "https://github.com/sempervictus/cudaforge.git", branch = "compat/f_suffix"}
anyhow = { version = "1", features = ["backtrace"] }
sha2 = "0.10"
ureq = { version = "2.10", default-features = true }

[features]
no-marlin = []
no-fp8-kvcache = []
cutlass = []
flashinfer = []
trtllm = ["flashinfer"]
